    const RANKS = {
      member:    { labelKey: 'rankMember',    cls: 'bg-zinc-800/80 text-zinc-300 border-zinc-700' },
      vip:       { labelKey: 'rankVip',       cls: 'bg-violet-400/10 text-violet-300 border-violet-400/30' },
      moderator: { labelKey: 'rankModerator', cls: 'bg-sky-400/10 text-sky-300 border-sky-400/30' },
      admin:     { labelKey: 'rankAdmin',     cls: 'bg-amber-400/10 text-amber-400 border-amber-400/20' }
    };
    const COLOR_PRESETS = ['#fbbf24', '#f87171', '#fb923c', '#34d399', '#38bdf8', '#a78bfa', '#f472b6', '#ffffff'];
    const DEFAULT_ADMIN_INFO = { rank: 'member', verified: false, nameColor: '', suspended: false };

    const hasRank = (r) => Object.prototype.hasOwnProperty.call(RANKS, r);
    const safeColor = (c) => (/^#[0-9a-fA-F]{6}$/.test(c || '') ? c : undefined);
    const getAdminInfo = (data, uid) => ({ ...DEFAULT_ADMIN_INFO, ...((data && data[uid]) || {}) });

    // Keeps only valid admin fields
    const cleanAdminPatch = (patch) => {
      const clean = {};
      if ('rank' in patch && hasRank(patch.rank)) clean.rank = patch.rank;
      if ('verified' in patch) clean.verified = !!patch.verified;
      if ('suspended' in patch) clean.suspended = !!patch.suspended;
      if ('nameColor' in patch) clean.nameColor = safeColor(patch.nameColor) || '';
      return clean;
    };

    const makeUsername = (email, attempt) => {
      let base = defaultUsername(email);
      if (base.length < 3) base = (base + 'user').slice(0, 8);
      if (attempt === 0) return base;
      return base.slice(0, 16) + String(Math.floor(100 + Math.random() * 900));
    };

    // Creates the user's document the first time they sign in (and claims a unique @username)
    const ensureUserDoc = async (u) => {
      const ref = db.collection('users').doc(u.uid);
      const snap = await ref.get();
      if (snap.exists) return snap.data();
      let lastErr = null;
      for (let i = 0; i < 6; i++) {
        const username = makeUsername(u.email, i);
        const data = {
          name: (u.displayName || defaultUsername(u.email)).slice(0, 40),
          username,
          picture: u.photoURL || '',
          joined: serverTs(),
          rank: 'member',
          verified: false,
          nameColor: '',
          suspended: false
        };
        const batch = db.batch();
        batch.set(db.collection('usernames').doc(username), { uid: u.uid });
        batch.set(ref, data);
        try {
          await batch.commit();
          return { ...data, joined: null };
        } catch (e) {
          lastErr = e;
          if (e.code !== 'permission-denied') throw e; // permission-denied here usually = username already taken
        }
      }
      throw lastErr;
    };

    const tsToDate = (v) => {
      try { return v && v.toDate ? v.toDate().toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10); }
      catch (e) { return ''; }
    };

    // Finds a registered user by @username (or by display name when unique).
    // Returns { email } or { error: 'notfound' | 'ambiguous' }.
    const findRecipient = (users, raw) => {
      const q = (raw || '').trim().replace(/^@/, '').toLowerCase();
      if (!q) return { error: 'notfound' };
      const list = Object.keys(users).map((email) => ({
        email,
        username: String(users[email].username || defaultUsername(email)).toLowerCase(),
        name: String(users[email].name || '').toLowerCase()
      }));
      let matches = list.filter((u) => u.username === q);
      if (matches.length === 0) matches = list.filter((u) => u.name === q);
      if (matches.length === 0) return { error: 'notfound' };
      if (matches.length > 1) return { error: 'ambiguous' };
      return { email: matches[0].email };
    };

    const formatMsgTime = (ts, lang) => {
      try {
        return new Date(ts).toLocaleString(lang === 'es' ? 'es-MX' : 'en-US', {

        });
      } catch (e) { return ''; }

      return (

    // ---------- Messaging (Firestore) ----------
    const REPLY_SEEN_KEY = 'dashReplySeen';
    const tsMillis = (v) => (v && v.toMillis ? v.toMillis() : Date.now());

    function useMessaging(uid) {
      const [inbox, setInbox] = useState([]);
      const [outbox, setOutbox] = useState([]);
      const [threads, setThreads] = useState({});
      const seenKey = REPLY_SEEN_KEY + ':' + uid;
      const [seen, setSeen] = useState(() => readJSON(seenKey, {}));
      const subs = React.useRef({});

      useEffect(() => {
        const mapDocs = (snap, sent) => snap.docs.map((d) => {
          const x = d.data({ serverTimestamps: 'estimate' });
          const base = { id: (sent ? 'o' : 'i') + d.id, rawId: d.id, kind: sent ? 'out' : 'in', tok: x.tok || '', text: x.text || '', sticker: x.sticker || '', ts: tsMillis(x.ts), isAnon: !!x.isAnon };
          return sent
            ? { ...base, fromEmail: uid, toEmail: x.toUid, toName: x.toName, toUsername: x.toUsername, read: true }
            : { ...base, fromEmail: x.fromUid || null, toEmail: uid, fromName: x.fromName, fromUsername: x.fromUsername, read: x.read !== false };
        });
        const q = (col) => db.collection(col).doc(uid).collection('messages').orderBy('ts', 'desc').limit(100);
        const u1 = q('inboxes').onSnapshot((s) => setInbox(mapDocs(s, false)), (e) => console.error('inbox', e));
        const u2 = q('outboxes').onSnapshot((s) => setOutbox(mapDocs(s, true)), (e) => console.error('outbox', e));
        return () => { u1(); u2(); };
      }, [uid]);

      // Replies live in threads/{tok}/messages; we listen to the 25 most recent conversations
      const all = [...inbox, ...outbox].sort((a, b) => b.ts - a.ts);
      const tokList = [];
      all.forEach((m) => { if (m.tok && tokList.indexOf(m.tok) === -1 && tokList.length < 25) tokList.push(m.tok); });
      const tokKey = tokList.join(',');
      useEffect(() => {
        const want = {};
        tokList.forEach((k) => { want[k] = true; });
        Object.keys(subs.current).forEach((k) => {
          if (!want[k]) {
            subs.current[k]();
            delete subs.current[k];
            setThreads((p) => { const n = { ...p }; delete n[k]; return n; });
          }
        });
        tokList.forEach((tok) => {
          if (subs.current[tok]) return;
          subs.current[tok] = db.collection('threads').doc(tok).collection('messages').orderBy('ts', 'asc').limit(50).onSnapshot((s) => {
            const arr = s.docs.map((d) => {
              const x = d.data({ serverTimestamps: 'estimate' });
              return { id: d.id, text: x.text || '', sticker: x.sticker || '', by: x.by, ts: tsMillis(x.ts) };
            });
            setThreads((p) => ({ ...p, [tok]: arr }));
          }, (e) => console.error('thread', e));
        });
      }, [tokKey]);
      useEffect(() => () => {
        Object.keys(subs.current).forEach((k) => subs.current[k]());
        subs.current = {};
      }, []);

      const roleOf = (m) => (m.kind === 'in' ? 'r' : 's');
      const unreadReplies = (m) => {
        const arr = threads[m.tok] || [];
        const lastSeen = seen[m.tok] || 0;
        return arr.filter((r) => r.by !== roleOf(m) && r.ts > lastSeen).length;
      };
      const unreadIn = inbox.filter((m) => !m.read).length;
      const unreadRepliesTotal = all.reduce((n, m) => (m.tok && tokList.indexOf(m.tok) !== -1 ? n + (unreadReplies(m) > 0 ? 1 : 0) : n), 0);

      const markReplySeen = (tok) => {
        const arr = threads[tok] || [];
        if (!arr.length) return;
        const top = arr[arr.length - 1].ts;
        if ((seen[tok] || 0) >= top) return;
        const next = { ...seen, [tok]: top };
        setSeen(next);
        writeJSON(seenKey, next);
      };
      const markAllRead = async () => {
        const pending = inbox.filter((m) => !m.read).slice(0, 400);
        if (!pending.length) return;
        try {
          const batch = db.batch();
          pending.forEach((m) => batch.update(db.collection('inboxes').doc(uid).collection('messages').doc(m.rawId), { read: true }));
          await batch.commit();
        } catch (e) { console.error('markRead', e); }
      };
      const deleteMessage = async (m) => {
        try { await db.collection(m.kind === 'in' ? 'inboxes' : 'outboxes').doc(uid).collection('messages').doc(m.rawId).delete(); }
        catch (e) { console.error('delete', e); window.alert('Error (' + (e.code || '?') + ')'); }
      };
      const sendReply = async (m, text, sticker) => {
        const doc = { ts: serverTs(), by: roleOf(m) };
        if (text) doc.text = text;
        if (sticker) doc.sticker = sticker;
        await db.collection('threads').doc(m.tok).collection('messages').add(doc);
      };

      return { inbox, outbox, all, threads, seen, unreadIn, unreadRepliesTotal, unreadTotal: unreadIn + unreadRepliesTotal, unreadReplies, roleOf, markReplySeen, markAllRead, deleteMessage, sendReply };
    }

    function MessageCard({ msg, party, info, fresh, thread, myProfile, myAdmin, canBlock, isBlocked, t, lang, unreadReplies, onSeen, onReply, onDelete, onBlock, onReport }) {

                      <span className="text-zinc-500 text-[11px]">@{party.username}</span>

                  {sent && !msg.isAnon && (
                    <span className="text-zinc-400 text-[11px]">

              {fresh && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-400 text-black font-bold">{t.newBadge}</span>}
              <span className={`text-[10px] px-2.5 py-1 rounded-full border font-medium ${
                !sent ? 'bg-emerald-400/10 text-emerald-300 border-emerald-400/30'
                  : msg.isAnon ? 'bg-amber-400/10 text-amber-400 border-amber-400/20'
                  : 'bg-zinc-800/80 text-zinc-300 border-zinc-700'}`}>
                {!sent ? t.receivedStatus : (msg.isAnon ? t.sentAnonStatus : t.sentIdentStatus)}
              </span>
            </div>
          </div>

          <div className="pl-10 space-y-2">
            {msg.sticker && <div><StickerBubble s={msg.sticker} size="text-6xl" /></div>}

          </div>

          {open && (
            <div className="pl-10 space-y-2">
              {thread.map((r) => {

                return (
                  <div key={r.id} className={`flex ${mine ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] rounded-2xl px-3 py-2 text-sm ${mine ? 'bg-amber-400/15 text-amber-100 rounded-br-sm' : 'bg-zinc-800/80 text-zinc-200 rounded-bl-sm'}`}>
                      {r.sticker && <StickerBubble s={r.sticker} size="text-5xl" />}
                      {r.text && <p className="whitespace-pre-wrap break-words">{r.text}</p>}
                      <p className="text-[9px] text-zinc-500 mt-1">{formatMsgTime(r.ts, lang)}</p>

              <form onSubmit={submitReply} className="space-y-2">

              <button type="button" onClick={onReport} className="px-2.5 py-1 rounded-lg border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700">🚩 {t.reportMsg}</button>
            )}
            {canBlock && (
              <button type="button" onClick={onBlock} className="px-2.5 py-1 rounded-lg border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700">{isBlocked ? t.unblockUser : '🚫 ' + t.blockUser}</button>

    function MessagesView({ mode = 'all', userEmail, profile, myAdmin, adminData, isAnonymous, setIsAnonymous, lang, messaging, blocks, onBlock, onUnblock, onReport, presetSticker, clearPreset, presetRecipient, clearRecipient }) {
      const t = translations[lang];
      const registered = adminData; // users list, live from Firestore
      const [recipient, setRecipient] = useState('');
      const [text, setText] = useState('');
      const [sticker, setSticker] = useState('');
      const [showPicker, setShowPicker] = useState(false);
      const [sendError, setSendError] = useState('');
      const [sendOk, setSendOk] = useState(false);
      const [sending, setSending] = useState(false);
      const [freshIds] = useState(() => {
        const o = {};
        messaging.inbox.forEach((m) => { if (!m.read) o[m.id] = true; });
        return o;
      });

      useEffect(() => {
        if (presetSticker) { setSticker(presetSticker); clearPreset(); }
      }, [presetSticker]);
      useEffect(() => {
        if (presetRecipient) { setRecipient('@' + presetRecipient); clearRecipient(); }
      }, [presetRecipient]);

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (sending) return;
        setSendOk(false);
        const to = recipient.trim();
        const body = text.trim().slice(0, 1000);
        if (!to || (!body && !sticker)) return;

        // The recipient must be a registered user, otherwise nothing is sent
        const found = findRecipient(registered, to);
        if (found.error === 'ambiguous') { setSendError(t.msgUserAmbiguous); return; }
        if (found.error) { setSendError(t.msgUserNotFound); return; }

        const toUid = found.email;
        const target = registered[toUid];
        if (isAnonymous && target.acceptAnon === false) { setSendError(t.msgNoAnon); return; }

        const id = db.collection('inboxes').doc().id;
        const tok = newTok();
        const inboxDoc = { text: body, ts: serverTs(), isAnon: !!isAnonymous, read: false, tok };
        if (sticker) inboxDoc.sticker = sticker;
        if (!isAnonymous) {
          inboxDoc.fromUid = userEmail;
          inboxDoc.fromName = profile.name;
          inboxDoc.fromUsername = profile.username;
        }
        const outboxDoc = {
          text: body, ts: serverTs(), isAnon: !!isAnonymous, tok,
          toUid, toName: target.name || '', toUsername: target.username || ''
        };
        if (sticker) outboxDoc.sticker = sticker;
        setSending(true);
        try {
          const batch = db.batch();
          batch.set(db.collection('inboxes').doc(toUid).collection('messages').doc(id), inboxDoc);
          batch.set(db.collection('outboxes').doc(userEmail).collection('messages').doc(id), outboxDoc);
          await batch.commit();
          if (sticker) pushRecentSticker(sticker);
          if (!isAnonymous) updateStreak(userEmail, toUid).catch((e) => console.error('streak', e));
          setSendError('');
          setRecipient('');
          setText('');
          setSticker('');
          setShowPicker(false);
          setSendOk(true);
          setTimeout(() => setSendOk(false), 3000);
        } catch (err) {
          console.error('send', err);
          setSendError(err && err.code === 'permission-denied' ? t.msgDenied : t.msgSendFailed + (err && err.code ? ' (' + err.code + ')' : ''));
        }
        setSending(false);
      };

      const visible = messaging.all;

      const describe = (uid, snapName, snapUser) => {
        const r = registered[uid];
        return {
          email: uid,
          name: (r && r.name) || snapName || t.unknownUser,
          username: (r && (r.username || defaultUsername(uid))) || snapUser || '',
          picture: (r && r.picture) || ''
        };
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <div className="flex items-center space-x-2">
                <h2 className="text-2xl font-bold text-white tracking-tight">{t.messageCenter}</h2>
                <span className={`text-[10px] uppercase font-bold tracking-wider px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm ${
                  isAnonymous ? 'bg-amber-400 text-black shadow-amber-400/20' : 'bg-zinc-800 text-zinc-300 border border-zinc-700'
                }`}>
                  <Icon name={isAnonymous ? "shield-off" : "user-check"} className="w-3 h-3" />
                  {isAnonymous ? t.anonBadge : t.publicBadge}
                </span>
              </div>
              <p className="text-xs text-zinc-400 mt-1">{isAnonymous ? t.anonActiveDesc : t.identActiveDesc}</p>
            </div>
            <span className="text-xs px-3 py-1 rounded-full bg-amber-400/10 text-amber-400 border border-amber-400/20 font-medium">
              {visible.length} {t.messages}
            </span>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Form Column */}
            <div className={`${mode === 'inbox' ? 'hidden ' : ''}${mode === 'compose' ? 'lg:col-span-3' : 'lg:col-span-1'} p-6 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 h-fit`}>
              <h3 className="text-lg font-semibold text-white flex items-center space-x-2 mb-4">
                <Icon name="send" className="w-4 h-4 text-amber-400" />
                <span>{isAnonymous ? t.sendAnon : t.sendMessage}</span>
              </h3>

              <div className="mb-3 grid grid-cols-2 gap-1 p-1 rounded-xl bg-zinc-950 border border-zinc-800">
                <button type="button" onClick={() => setIsAnonymous && setIsAnonymous(true)} className={`py-2 rounded-lg text-xs font-semibold ${isAnonymous ? 'bg-amber-400 text-black' : 'text-zinc-400'}`}>🕶️ {t.modeAnon}</button>
                <button type="button" onClick={() => setIsAnonymous && setIsAnonymous(false)} className={`py-2 rounded-lg text-xs font-semibold ${!isAnonymous ? 'bg-white text-black' : 'text-zinc-400'}`}>🙂 {t.modeNamed}</button>
              </div>
              {!isAnonymous && <p className="mb-3 text-[11px] text-orange-300/90">🔥 {t.streakCounts}</p>}

              <div className={`mb-4 p-3 rounded-xl border flex items-start space-x-2.5 ${
                isAnonymous ? 'bg-amber-400/10 border-amber-400/20 text-amber-200/90' : 'bg-zinc-950/80 border-zinc-800 text-zinc-400'
              }`}>
                <Icon name={isAnonymous ? "eye-off" : "user"} className="w-4 h-4 text-amber-400 flex-shrink-0 mt-0.5" />
                <p className="text-xs leading-relaxed">{isAnonymous ? t.privacyNoticeAnon : t.privacyNoticeIdent}</p>
              </div>

              <form onSubmit={handleSendMessage} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">{t.recipientLabel}</label>
                  <input
                    type="text"
                    required
                    value={recipient}
                    onChange={(e) => { setRecipient(e.target.value); setSendError(''); }}
                    placeholder={t.recipientPlaceholder}
                    autoCapitalize="none"
                    autoCorrect="off"
                    spellCheck="false"
                    className="w-full px-3.5 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all"
                  />
                  <p className="text-[11px] text-zinc-500 mt-1.5">{t.recipientHint}</p>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">{t.messageLabel}</label>
                  <textarea
                    rows="3"
                    maxLength={1000}
                    value={text}
                    onChange={(e) => setText(e.target.value)}
                    placeholder={t.messagePlaceholder}
                    className="w-full px-3.5 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all resize-none"
                  ></textarea>
                </div>

                <div className="space-y-2">
                  <div className="flex items-center gap-3">
                    <button type="button" onClick={() => setShowPicker(!showPicker)}
                      className="py-2 px-3.5 rounded-xl bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-zinc-200 text-xs font-medium flex items-center gap-2">
                      <span className="text-base">😊</span><span>{t.stickerPicker}</span>
                    </button>
                    {sticker && (
                      <div className="flex items-center gap-2">
                        <StickerBubble s={sticker} size="text-4xl" />
                        <button type="button" onClick={() => setSticker('')} className="text-[11px] text-zinc-400 underline">{t.removeSticker}</button>
                      </div>
                    )}
                  </div>
                  {showPicker && <StickerPicker lang={lang} onPick={(s) => { setSticker(s); setShowPicker(false); }} />}
                </div>

                {sendError && <p className="text-xs text-rose-400">{sendError}</p>}
                {sendOk && <p className="text-xs text-emerald-400">✓ {t.msgSent}</p>}

                <button
                  type="submit"
                  disabled={sending}
                  className="w-full py-3 px-4 bg-amber-400 hover:bg-amber-300 disabled:opacity-60 text-black font-semibold rounded-xl text-sm flex items-center justify-center space-x-2 shadow-lg shadow-amber-400/20 transition-all active:scale-[0.99]"
                >
                  <Icon name="send" className="w-4 h-4" />
                  <span>{isAnonymous ? t.sendAnon : t.sendMessage}</span>
                </button>
              </form>
            </div>

            {/* Messages Feed */}
            <div className={`${mode === 'compose' ? 'hidden ' : ''}${mode === 'inbox' ? 'lg:col-span-3' : 'lg:col-span-2'} p-6 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 flex flex-col`}>
              <h3 className="text-lg font-semibold text-white mb-4 flex items-center space-x-2">
                <Icon name="message-square" className="w-4 h-4 text-amber-400" />
                <span>{t.messageHistory}</span>
              </h3>

              <div className="space-y-3 overflow-y-auto max-h-[600px] pr-1">
                {visible.length === 0 ? (
                  <div className="text-center py-12 text-zinc-500 text-sm">{t.noMessages}</div>
                ) : (
                  visible.map((msg) => {
                    const sent = msg.kind === 'out';
                    // Anonymous messages hide the sender from whoever receives them
                    const party = sent
                      ? describe(msg.toEmail, msg.toName, msg.toUsername)
                      : (msg.isAnon || !msg.fromEmail ? null : describe(msg.fromEmail, msg.fromName, msg.fromUsername));
                    const info = party ? getAdminInfo(adminData, party.email) : null;
                    const canBlock = !sent && !!party && !!msg.fromEmail && msg.fromEmail !== userEmail;
                    const blocked = canBlock && !!blocks[msg.fromEmail];
                    return (
                      <MessageCard
                        key={msg.id}
                        msg={msg}
                        party={party}
                        info={info}
                        fresh={!!freshIds[msg.id]}
                        thread={messaging.threads[msg.tok] || []}
                        unreadReplies={messaging.unreadReplies(msg)}
                        myProfile={profile}
                        myAdmin={myAdmin}
                        canBlock={canBlock}
                        isBlocked={blocked}
                        t={t}
                        lang={lang}
                        onSeen={() => messaging.markReplySeen(msg.tok)}
                        onReply={(txt, stk) => messaging.sendReply(msg, txt, stk)}
                        onDelete={() => { if (window.confirm(t.confirmDelMsg)) messaging.deleteMessage(msg); }}
                        onBlock={() => {
                          if (blocked) onUnblock(msg.fromEmail);
                          else if (window.confirm(t.confirmBlock)) onBlock(msg.fromEmail, party.name, party.username);
                        }}
                        onReport={() => {
                          if (window.confirm(t.confirmReport)) onReport({ kind: 'message', targetUid: msg.isAnon ? '' : (msg.fromEmail || ''), text: (msg.text || msg.sticker || '').slice(0, 200), tok: msg.tok });
                        }}
                      />
                    );
                  })
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

        { label: t.statUnread, value: String(messaging.unreadTotal), icon: 'bell', hot: messaging.unreadTotal > 0 },

          />

            ) : (

                    <div className="flex items-center space-x-3 min-w-0">

                          {u.name.charAt(0).toUpperCase()}
                        </div>
                      )}
                      <div className="min-w-0">
                        <p className="text-sm font-semibold text-white truncate">
                          <UserName name={u.name} info={u.info} t={t} />
                          {isSelf && (
                            <span className="ml-2 text-[10px] px-2 py-0.5 rounded-full bg-amber-400 text-black font-bold align-middle">
                              {t.youBadge}
                            </span>

                        <p className="text-xs text-zinc-500 truncate">@{u.username}</p>

                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-[10px] font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">
                          {t.adminRank}
                        </label>
                        <select
                          value={hasRank(u.info.rank) ? u.info.rank : 'member'}
                          onChange={(e) => onUpdateUser(u.email, { rank: e.target.value })}
                          className="w-full px-3 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-white text-sm focus:outline-none focus:border-amber-400"
                        >
                          {Object.keys(RANKS).map((r) => (
                            <option key={r} value={r}>{t[RANKS[r].labelKey]}</option>
                          ))}
                        </select>
                      </div>

                      <div className="space-y-3">
                        <div className="flex items-center justify-between gap-3">
                          <span className="text-xs text-zinc-300">{t.adminVerified}</span>
                          <SwitchBtn
                            checked={!!u.info.verified}
                            onChange={(v) => onUpdateUser(u.email, { verified: v })}
                            onClass="bg-sky-400"
                          />

                        <div className="flex items-center justify-between gap-3">
                          <span className="text-xs text-zinc-300">{t.adminSuspend}</span>

                        {COLOR_PRESETS.map((c) => (

    function SettingsView({ lang, setLang, isAnonymous, setIsAnonymous, acceptAnon, onToggleAcceptAnon, blocks, onUnblock, announcement, onSetAnnouncement, reports, onResolveReport, userEmail, authEmail, isOwner, onRemoveUserAdmin, profile, profileEdits, googlePicture, onSaveProfile, adminUnlocked, onAdminUnlock, onAdminLock, adminData, onUpdateUserAdmin, onResetAdminData }) {
      const t = translations[lang];
      const [savedAlert, setSavedAlert] = useState(false);

      // Profile editing
      const [displayName, setDisplayName] = useState(profile.name);
      const [username, setUsername] = useState(profile.username);
      const [pendingPicture, setPendingPicture] = useState(undefined); // undefined = unchanged, '' = removed
      const [profileError, setProfileError] = useState('');
      const [profileSavedAlert, setProfileSavedAlert] = useState(false);

      // Admin gate
      const [adminPass, setAdminPass] = useState('');
      const [adminError, setAdminError] = useState('');
      const handleAdminUnlock = (e) => {
        e.preventDefault();
        if (adminPass === ADMIN_PASSWORD) {
          if (!isOwner) { setAdminError(t.adminNotOwner); return; }
          setAdminPass('');
          setAdminError('');
          onAdminUnlock();
        } else {
          setAdminError(t.adminWrongPassword);
        }
      };

      const hasCustomPhoto = pendingPicture !== undefined ? !!pendingPicture : !!profileEdits.picture;
      const previewPicture = pendingPicture !== undefined ? (pendingPicture || googlePicture) : profile.picture;

      // Resize + center-crop the chosen photo to a 256x256 JPEG so it fits in browser storage
      const handlePhotoChange = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!file.type || file.type.indexOf('image/') !== 0) { setProfileError(t.photoInvalid); return; }
        if (file.size > 15 * 1024 * 1024) { setProfileError(t.photoTooBig); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const side = Math.min(img.width, img.height);
            const sx = (img.width - side) / 2;
            const sy = (img.height - side) / 2;
            canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
            setPendingPicture(canvas.toDataURL('image/jpeg', 0.85));
            setProfileError('');
          };
          img.onerror = () => setProfileError(t.photoInvalid);
          img.src = reader.result;
        };
        reader.onerror = () => setProfileError(t.photoInvalid);
        reader.readAsDataURL(file);
      };

      const handleProfileSave = async () => {
        const name = displayName.trim();
        const user = username.trim();
        if (!name) { setProfileError(t.errNameEmpty); return; }
        if (!/^[a-z0-9_.]{3,20}$/.test(user)) { setProfileError(t.errUsername); return; }
        const others = adminData;
        const taken = Object.keys(others).some(
          (em) => em !== userEmail && String(others[em].username || defaultUsername(em)).toLowerCase() === user
        );
        if (taken) { setProfileError(t.errUsernameTaken); return; }
        const edits = {
          displayName: name,
          username: user,
          picture: pendingPicture !== undefined ? pendingPicture : (profileEdits.picture || '')
        };
        const res = await onSaveProfile(edits);
        if (res !== true) { setProfileError(res === 'taken' ? t.errUsernameTaken : t.saveFailed); return; }
        setProfileError('');
        setPendingPicture(undefined);
        setProfileSavedAlert(true);
        setTimeout(() => setProfileSavedAlert(false), 3000);
      };

      const handleSave = () => {
        setSavedAlert(true);
        setTimeout(() => setSavedAlert(false), 3000);
      };

      return (
        <div className="space-y-6 animate-fade-in max-w-4xl">
          <div>
            <h2 className="text-2xl font-bold text-white tracking-tight">{t.settingsTitle}</h2>
            <p className="text-xs text-zinc-400 mt-1">{t.settingsDesc}</p>
          </div>

          {savedAlert && (
            <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm flex items-center space-x-2 animate-bounce">
              <Icon name="check-circle" className="w-5 h-5 flex-shrink-0" />
              <span>{t.settingsSaved}</span>
            </div>
          )}

          {profileSavedAlert && (
            <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm flex items-center space-x-2">
              <span>✓</span>
              <span>{t.profileSaved}</span>
            </div>
          )}

          <div className="space-y-4">
            {/* Profile */}
            <div className="p-6 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 space-y-5">
              <div className="space-y-1">
                <div className="flex items-center space-x-2">
                  <Icon name="user" className="w-5 h-5 text-amber-400" />
                  <h3 className="text-base font-semibold text-white">{t.profileTitle}</h3>
                </div>
                <p className="text-xs text-zinc-400">{t.profileDesc}</p>
              </div>

              <div className="flex items-center gap-4">
                {previewPicture ? (
                  <img
                    src={previewPicture}
                    alt=""
                    referrerPolicy="no-referrer"
                    className="w-20 h-20 rounded-full border border-zinc-700 object-cover flex-shrink-0"
                  />
                ) : (
                  <div className="w-20 h-20 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-amber-400 font-bold text-2xl flex-shrink-0">
                    {(displayName || profile.name || '?').charAt(0).toUpperCase()}
                  </div>
                )}
                <div className="flex flex-wrap gap-2">
                  <label className="cursor-pointer py-2.5 px-4 bg-amber-400 hover:bg-amber-300 text-black font-semibold rounded-xl text-xs flex items-center space-x-2 transition-all active:scale-[0.99]">
                    <Icon name="camera" className="w-4 h-4" />
                    <span>{t.changePhoto}</span>
                    <input type="file" accept="image/*" onChange={handlePhotoChange} className="hidden" />
                  </label>
                  {hasCustomPhoto && (
                    <button
                      type="button"
                      onClick={() => setPendingPicture('')}
                      className="py-2.5 px-4 bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-zinc-300 rounded-xl text-xs font-medium transition-all"
                    >
                      {t.removePhoto}
                    </button>
                  )}
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">
                  {t.displayNameLabel}
                </label>
                <input
                  type="text"
                  maxLength={40}
                  value={displayName}
                  onChange={(e) => setDisplayName(e.target.value)}
                  placeholder={t.displayNamePlaceholder}
                  className="w-full px-3.5 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">
                  {t.usernameLabel}
                </label>
                <div className="relative">
                  <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-zinc-500 text-sm">@</span>
                  <input
                    type="text"
                    maxLength={20}
                    value={username}
                    onChange={(e) => setUsername(sanitizeUsername(e.target.value))}
                    autoCapitalize="none"
                    autoCorrect="off"
                    spellCheck="false"
                    className="w-full pl-8 pr-4 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all"
                  />
                </div>
                <p className="text-[11px] text-zinc-500 mt-1.5">{t.usernameHint}</p>
              </div>

              <div>
                <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">
                  {t.emailReadonly}
                </label>
                <p className="px-3.5 py-2.5 bg-zinc-950/40 border border-zinc-800/60 rounded-xl text-zinc-500 text-sm truncate">{authEmail}</p>
              </div>

              {profileError && <p className="text-xs text-rose-400">{profileError}</p>}

              <div className="flex justify-end">

    // ---------- Streaks ----------
    // Un día = día en UTC-6 (hora de México), para que todos cambien de día a la vez.
    const dayStr = (offsetDays = 0) => new Date(Date.now() - 6 * 3600e3 + offsetDays * 864e5).toISOString().slice(0, 10);
    const pairId = (a, b) => (a < b ? a + '_' + b : b + '_' + a);

    // Called after sending a NON-anonymous message. The streak grows by 1 on a day when BOTH people wrote.
    const updateStreak = async (me, other) => {
      const ref = db.collection('streaks').doc(pairId(me, other));
      const today = dayStr(0), yest = dayStr(-1);
      await db.runTransaction(async (tx) => {
        const s = await tx.get(ref);
        if (!s.exists) {
          tx.set(ref, { members: [me, other].sort(), count: 0, lastDay: '', sent: { [me]: today } });
          return;
        }
        const d = s.data();
        const sent = { ...(d.sent || {}), [me]: today };
        let count = d.count || 0, lastDay = d.lastDay || '';
        if (sent[other] === today && lastDay !== today) {
          count = lastDay === yest ? count + 1 : 1;
          lastDay = today;
        }
        tx.update(ref, { sent, count, lastDay });
      });
    };

    const streakView = (d, me) => {
      const other = (d.members || []).find((m) => m !== me) || '';
      const today = dayStr(0), yest = dayStr(-1);
      const alive = d.lastDay === today || d.lastDay === yest;
      const count = alive ? (d.count || 0) : 0;
      const sent = d.sent || {};
      return {
        id: d.id, other, count,
        doneToday: d.lastDay === today,
        iSent: sent[me] === today,
        theySent: sent[other] === today,
        atRisk: count > 0 && d.lastDay !== today
      };
    };

    function useStreaks(uid) {

          (s) => setList(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (e) => console.error('streaks', e)
        );
      }, [uid]);
      const views = list.map((d) => streakView(d, uid)).sort((a, b) => b.count - a.count);
      return { views, best: views.reduce((m, v) => Math.max(m, v.count), 0), atRisk: views.filter((v) => v.atRisk).length };
    }

        const n = name.trim();
        if (!n) { setError(t.groupNameEmpty); return; }
        if (count + 1 > MAX_GROUP) { setError(t.groupTooMany); return; }
        setBusy(true);
        try {
          const ref = await db.collection('groups').add({ name: n.slice(0, 30), emoji, ownerUid: uid, members: [uid, ...Object.keys(picked)], ts: serverTs() });
          onCreated(ref.id);
        } catch (err) {
          console.error('create group', err);
          setError(t.msgSendFailed + (err && err.code ? ' (' + err.code + ')' : ''));
          setBusy(false);
        }
      };
      return (
        <form onSubmit={submit} className="space-y-4">
          <div className="flex items-center justify-between">
            <h3 className="text-lg font-semibold text-white">{t.groupNew}</h3>
            <button type="button" onClick={onCancel} className="text-xs text-zinc-400 underline">{t.cancel}</button>
          </div>
          <input type="text" maxLength={30} value={name} onChange={(e) => setName(e.target.value)} placeholder={t.groupNamePlaceholder}
            className="w-full px-3.5 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400" />
          <div className="flex flex-wrap gap-2">
            {GROUP_EMOJIS.map((e) => (
              <button key={e} type="button" onClick={() => setEmoji(e)} className={`w-10 h-10 rounded-xl text-xl ${emoji === e ? 'bg-amber-400' : 'bg-zinc-900 border border-zinc-800'}`}>{e}</button>
            ))}
          </div>
          <div className="space-y-2">
            <p className="text-xs font-semibold text-zinc-300 uppercase tracking-wider">{t.groupPickMembers} ({count})</p>
            <input type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t.searchUsers}
              className="w-full px-3.5 py-2 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400" />
            <div className="space-y-1.5 max-h-64 overflow-y-auto">
              {others.map((u) => (
                <PersonRow key={u.id} u={u} right={
                  <input type="checkbox" checked={!!picked[u.id]} onChange={() => setPicked((p) => { const n = { ...p }; if (n[u.id]) delete n[u.id]; else n[u.id] = true; return n; })} className="w-5 h-5 accent-amber-400" />
                } />
              ))}
              {others.length === 0 && <p className="text-xs text-zinc-500 py-3 text-center">{t.noUsersFound}</p>}
            </div>
          </div>
          {error && <p className="text-xs text-rose-400">{error}</p>}
          <button type="submit" disabled={busy} className="w-full py-3 bg-amber-400 hover:bg-amber-300 disabled:opacity-60 text-black font-semibold rounded-xl text-sm">{t.groupCreate}</button>
        </form>
      );
    }

    function GroupChat({ group, uid, adminData, lang, onBack }) {
      const t = translations[lang];
      const [msgs, setMsgs] = useState([]);
      const [text, setText] = useState('');
      const [sticker, setSticker] = useState('');
      const [showPicker, setShowPicker] = useState(false);
      const [showMembers, setShowMembers] = useState(false);
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);
      const bottomRef = React.useRef(null);
      const isOwner = group.ownerUid === uid;
      const ref = db.collection('groups').doc(group.id);

      useEffect(() => {
        return ref.collection('messages').orderBy('ts', 'desc').limit(100).onSnapshot((s) => {
          setMsgs(s.docs.map((d) => {
            const x = d.data({ serverTimestamps: 'estimate' });
            return { id: d.id, rawId: d.id, text: x.text || '', sticker: x.sticker || '', fromUid: x.fromUid, ts: tsMillis(x.ts) };
          }).reverse());
        }, (e) => console.error('group msgs', e));
      }, [group.id]);
      useEffect(() => { if (bottomRef.current && bottomRef.current.scrollIntoView) bottomRef.current.scrollIntoView({ block: 'end' }); }, [msgs.length]);

      const send = async (e) => {
        e.preventDefault();
        const body = text.trim().slice(0, 500);
        if ((!body && !sticker) || busy) return;
        setBusy(true);
        const doc = { fromUid: uid, ts: serverTs() };
        if (body) doc.text = body;
        if (sticker) doc.sticker = sticker;
        try {
          await ref.collection('messages').add(doc);
          if (sticker) pushRecentSticker(sticker);
          setText(''); setSticker(''); setShowPicker(false); setError('');
        } catch (err) {
          console.error('group send', err);
          setError(t.msgSendFailed + (err && err.code ? ' (' + err.code + ')' : ''));
        }
        setBusy(false);
      };
      const addMember = (id) => ref.update({ members: firebase.firestore.FieldValue.arrayUnion(id) }).catch((e) => window.alert(t.saveFailed + ' (' + e.code + ')'));
      const removeMember = (id) => ref.update({ members: firebase.firestore.FieldValue.arrayRemove(id) }).catch((e) => window.alert(t.saveFailed + ' (' + e.code + ')'));
      const leave = async () => { if (window.confirm(t.groupConfirmLeave)) { try { await removeMember(uid); onBack(); } catch (e) {} } };
      const del = async () => { if (window.confirm(t.groupConfirmDelete)) { try { await ref.delete(); onBack(); } catch (e) { window.alert(t.saveFailed + ' (' + e.code + ')'); } } };
      const nonMembers = Object.keys(adminData).filter((id) => group.members.indexOf(id) === -1 && !adminData[id].suspended);

      return (
        <div className="flex flex-col rounded-2xl bg-zinc-900/60 border border-zinc-800/80 overflow-hidden" style={{ minHeight: '60vh' }}>
          <div className="flex items-center gap-3 p-3 border-b border-zinc-800">
            <button type="button" onClick={onBack} className="text-zinc-300 text-lg px-1" aria-label="back">←</button>
            <div className="text-2xl">{group.emoji}</div>
            <div className="min-w-0 flex-1">
              <p className="text-sm font-semibold text-white truncate">{group.name}</p>
              <p className="text-[11px] text-zinc-500">{group.members.length} {t.groupMembers}</p>
            </div>
            <button type="button" onClick={() => setShowMembers(!showMembers)} className="px-3 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 text-xs">{t.groupMembers}</button>
          </div>

          {showMembers && (
            <div className="p-3 border-b border-zinc-800 space-y-2 max-h-64 overflow-y-auto">
              {group.members.map((id) => {
                const u = adminData[id] || { name: t.unknownUser, username: '' };
                return <PersonRow key={id} u={u} right={
                  id === group.ownerUid ? <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-400 text-black font-bold">{t.groupOwner}</span>
                    : (isOwner ? <button type="button" onClick={() => removeMember(id)} className="text-[11px] text-rose-400">{t.groupRemove}</button> : null)
                } />;
              })}
              {isOwner && group.members.length < MAX_GROUP && nonMembers.length > 0 && (
                <div className="pt-2 space-y-1.5">
                  <p className="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold">{t.groupAdd}</p>
                  {nonMembers.map((id) => <PersonRow key={id} u={adminData[id]} right={<button type="button" onClick={() => addMember(id)} className="text-[11px] text-amber-400">+ {t.groupAddBtn}</button>} />)}
                </div>
              )}
              <div className="pt-2">
                {isOwner
                  ? <button type="button" onClick={del} className="px-3 py-1.5 rounded-lg border border-rose-500/30 text-rose-400 text-xs">{t.groupDelete}</button>
                  : <button type="button" onClick={leave} className="px-3 py-1.5 rounded-lg border border-rose-500/30 text-rose-400 text-xs">{t.groupLeave}</button>}
              </div>
            </div>
          )}

          <div className="flex-1 overflow-y-auto p-3 space-y-2" style={{ maxHeight: '55vh' }}>
            {msgs.length === 0 && <p className="text-center text-zinc-500 text-sm py-10">{t.groupNoMsgs}</p>}
            {msgs.map((m) => {
              const mine = m.fromUid === uid;
              const u = adminData[m.fromUid];
              return (
                <div key={m.id} className={`flex ${mine ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[80%] rounded-2xl px-3 py-2 text-sm ${mine ? 'bg-amber-400/15 text-amber-100 rounded-br-sm' : 'bg-zinc-800/80 text-zinc-200 rounded-bl-sm'}`}>
                    {!mine && <p className="text-[11px] font-semibold mb-0.5" style={{ color: safeColor(getAdminInfo(adminData, m.fromUid).nameColor) || '#fbbf24' }}>{u ? u.name : t.unknownUser}</p>}
                    {m.sticker && <StickerBubble s={m.sticker} size="text-5xl" />}
                    {m.text && <p className="whitespace-pre-wrap break-words">{m.text}</p>}
                    <p className="text-[9px] text-zinc-500 mt-1">{formatMsgTime(m.ts, lang)}</p>
                  </div>
                </div>
              );
            })}
            <div ref={bottomRef}></div>
          </div>

          <form onSubmit={send} className="p-3 border-t border-zinc-800 space-y-2">
            {sticker && (
              <div className="flex items-center gap-2">
                <StickerBubble s={sticker} size="text-4xl" />
                <button type="button" onClick={() => setSticker('')} className="text-[11px] text-zinc-400 underline">{t.removeSticker}</button>
              </div>
            )}
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowPicker(!showPicker)} aria-label="stickers" className="px-3 rounded-xl bg-zinc-900 border border-zinc-800 text-lg">😊</button>
              <input type="text" maxLength={500} value={text} onChange={(e) => setText(e.target.value)} placeholder={t.groupMsgPlaceholder}
                className="flex-1 min-w-0 px-3 py-2 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400" />
              <button type="submit" disabled={busy} className="px-4 rounded-xl bg-amber-400 text-black text-xs font-semibold disabled:opacity-50">{t.replySend}</button>
            </div>
            {showPicker && <StickerPicker lang={lang} onPick={(s) => { setSticker(s); setShowPicker(false); }} />}
            {error && <p className="text-xs text-rose-400">{error}</p>}
          </form>
        </div>
      );
    }

    function GroupsView({ uid, adminData, groups, lang }) {
      const t = translations[lang];
      const [view, setView] = useState('list');
      const [openId, setOpenId] = useState(null);
      const open = groups.find((g) => g.id === openId);
      if (view === 'create') {
        return <GroupCreate uid={uid} adminData={adminData} lang={lang} onCancel={() => setView('list')} onCreated={(id) => { setOpenId(id); setView('list'); }} />;
      }
      if (open) {
        return <GroupChat key={open.id} group={open} uid={uid} adminData={adminData} lang={lang} onBack={() => setOpenId(null)} />;
      }
      return (
        <div className="space-y-4">
          <button type="button" onClick={() => setView('create')} className="w-full py-3 bg-amber-400 hover:bg-amber-300 text-black font-semibold rounded-xl text-sm">＋ {t.groupNew}</button>
          {groups.length === 0 ? (
            <div className="text-center py-10 text-zinc-500 text-sm">{t.noGroups}</div>
          ) : groups.map((g) => (
            <button key={g.id} type="button" onClick={() => setOpenId(g.id)} className="w-full text-left p-4 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-zinc-800 flex items-center justify-center text-2xl flex-shrink-0">{g.emoji}</div>
              <div className="min-w-0 flex-1">
                <p className="text-sm font-semibold text-white truncate">{g.name}</p>
                <p className="text-[11px] text-zinc-500">{g.members.length} {t.groupMembers}{g.ownerUid === uid ? ' · ' + t.groupOwner : ''}</p>
              </div>
              <span className="text-zinc-500">›</span>
            </button>
          ))}
        </div>
      );
    }

    const NavSvg = ({ kind }) => {
      const paths = {
        home: <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />,
        friends: <><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6" /><circle cx="17" cy="9" r="2.5" /><path d="M17 14c2.8 0 4.5 1.8 4.5 4.5" /></>,
        inbox: <path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z" />,
        user: <><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" /></>
      };
      return <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{paths[kind]}</svg>;
    };

    // Right-hand round buttons, like TikTok
    const RailBtn = ({ label, badge, onClick, children, testId }) => (
      <button type="button" onClick={onClick} data-testid={testId} className="flex flex-col items-center gap-1 active:scale-90 transition">
        <span className="relative w-12 h-12 rounded-full bg-white/10 backdrop-blur flex items-center justify-center text-2xl text-white">
          {children}
          {badge > 0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">{badge}</span>}
        </span>
        <span className="text-[11px] font-semibold text-white drop-shadow">{label}</span>
      </button>
    );

    function DashboardScreen({ blocks, onBlock, onUnblock, onReport, announcement, onSetAnnouncement, reports, onResolveReport, acceptAnon, onToggleAcceptAnon, userEmail, authEmail, isOwner, onRemoveUserAdmin, userProfile, profile, profileEdits, onSaveProfile, adminData, onUpdateUserAdmin, onResetAdminData, onLogout, lang, setLang, isAnonymous, setIsAnonymous }) {
      const t = translations[lang];
      const [activeItem, setActiveItem] = useState('Home'); // Home | Friends | Compose | Inbox | Profile | Setting | File Manager
      const [friendsTab, setFriendsTab] = useState('streaks'); // streaks | groups | users
      const [adminUnlocked, setAdminUnlocked] = useState(false); // locks again on logout or reload
      const myAdmin = getAdminInfo(adminData, userEmail);
      const messaging = useMessaging(userEmail);
      const streaks = useStreaks(userEmail);
      const groups = useGroups(userEmail);
      const [presetSticker, setPresetSticker] = useState('');
      const [presetRecipient, setPresetRecipient] = useState('');
      const [annSeen, setAnnSeen] = useState(() => readJSON('dashAnnSeen', 0));

      // Opening the inbox marks everything as read
      useEffect(() => {
        if (activeItem === 'Inbox' && messaging.unreadIn > 0) messaging.markAllRead();
      }, [activeItem, messaging.unreadIn]);
      const showAnn = announcement && announcement.active && announcement.text && announcement.ts > annSeen;

      const go = (item, tab) => { if (tab) setFriendsTab(tab); setActiveItem(item); };
      const sendTo = (uid) => {
        const u = adminData[uid];
        setPresetRecipient((u && u.username) || '');
        setIsAnonymous(false);
        setActiveItem('Compose');
      };

      const tabOf = { Home: 'Home', Friends: 'Friends', Compose: 'Compose', Inbox: 'Inbox', Profile: 'Profile', Setting: 'Profile', 'File Manager': 'Profile' };
      const current = tabOf[activeItem];
      const titles = { Friends: t.tabFriends, Compose: t.tabNew, Inbox: t.tabInbox, Profile: t.tabProfile, Setting: t.settingsTitle, 'File Manager': t.stickersTitle };

      const Avatar = ({ size = 'w-12 h-12' }) => (
        profile.picture ? (
          <img src={profile.picture} alt="" referrerPolicy="no-referrer" className={`${size} rounded-full border-2 border-white object-cover`} />
        ) : (
          <div className={`${size} rounded-full bg-zinc-800 border-2 border-white flex items-center justify-center text-amber-400 font-bold text-lg`}>{(profile.name || '?').charAt(0).toUpperCase()}</div>
        )
      );

      const annBanner = showAnn && (
        <div className="p-4 rounded-2xl bg-amber-400/10 border border-amber-400/30 flex items-start gap-3 backdrop-blur">
          <Icon name="megaphone" className="w-5 h-5 text-amber-400 flex-shrink-0 mt-0.5" />
          <div className="flex-1 min-w-0">
            <p className="text-[10px] uppercase tracking-wider font-bold text-amber-400">{t.announcementLabel}</p>
            <p className="text-sm text-amber-100 break-words">{announcement.text}</p>
          </div>
          <button type="button" onClick={() => { setAnnSeen(announcement.ts); writeJSON('dashAnnSeen', announcement.ts); }} className="text-zinc-400 hover:text-white text-sm px-1" aria-label={t.dismiss}>✕</button>
        </div>
      );

      const bottomBar = (
        <nav className="fixed bottom-0 inset-x-0 z-30 bg-black border-t border-zinc-900 h-16 flex items-center justify-around px-2" data-testid="bottom-nav">
          {[
            { id: 'Home', label: t.tabHome, svg: 'home' },
            { id: 'Friends', label: t.tabFriends, svg: 'friends' }
          ].map((it) => (
            <button key={it.id} type="button" onClick={() => go(it.id)} className={`flex flex-col items-center gap-0.5 w-16 ${current === it.id ? 'text-white' : 'text-zinc-500'}`}>
              <NavSvg kind={it.svg} /><span className="text-[10px] font-semibold">{it.label}</span>
            </button>
          ))}
          <button type="button" onClick={() => go('Compose')} aria-label={t.tabNew} className="relative w-12 h-8">
            <span className="absolute inset-0 -left-1 rounded-lg bg-cyan-400"></span>
            <span className="absolute inset-0 left-1 rounded-lg bg-rose-500"></span>
            <span className="absolute inset-0 rounded-lg bg-white flex items-center justify-center text-black text-2xl font-bold leading-none">+</span>
          </button>
          <button type="button" onClick={() => go('Inbox')} className={`relative flex flex-col items-center gap-0.5 w-16 ${current === 'Inbox' ? 'text-white' : 'text-zinc-500'}`}>
            <NavSvg kind="inbox" /><span className="text-[10px] font-semibold">{t.tabInbox}</span>
            {messaging.unreadTotal > 0 && <span className="absolute -top-0.5 right-3 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">{messaging.unreadTotal}</span>}
          </button>
          <button type="button" onClick={() => go('Profile')} className={`flex flex-col items-center gap-0.5 w-16 ${current === 'Profile' ? 'text-white' : 'text-zinc-500'}`}>
            <NavSvg kind="user" /><span className="text-[10px] font-semibold">{t.tabProfile}</span>
          </button>
        </nav>
      );

      // ---------- Home: empty "video" area + TikTok-style buttons on the right ----------
      if (activeItem === 'Home') {
        return (
          <div className="fixed inset-0 bg-black">
            {annBanner && <div className="absolute top-3 inset-x-3 z-20">{annBanner}</div>}
            <div className="absolute right-3 bottom-24 z-20 flex flex-col items-center gap-4" data-testid="rail">
              <button type="button" onClick={() => go('Profile')} className="relative mb-1" aria-label={t.tabProfile}>
                <Avatar />
                <span className="absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full bg-rose-500 text-white text-sm font-bold flex items-center justify-center leading-none">+</span>
              </button>
              <RailBtn label={streaks.best > 0 ? String(streaks.best) : t.railStreak} onClick={() => go('Friends', 'streaks')} badge={streaks.atRisk}>🔥</RailBtn>
              <RailBtn label={t.railGroups} onClick={() => go('Friends', 'groups')}>👥</RailBtn>
              <RailBtn label={t.railMessages} onClick={() => go('Inbox')} badge={messaging.unreadTotal}>💬</RailBtn>
              <RailBtn label={t.railStickers} onClick={() => go('File Manager')}>😊</RailBtn>
              <RailBtn label={t.railSettings} onClick={() => go('Setting')}>⚙️</RailBtn>
            </div>
            {bottomBar}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-black pb-24">
          <div className="max-w-3xl mx-auto px-4 pt-4 space-y-5">
            <header className="flex items-center justify-between gap-3">
              <div className="flex items-center gap-2 min-w-0">
                {(activeItem === 'Setting' || activeItem === 'File Manager') && (
                  <button type="button" onClick={() => go('Profile')} className="text-zinc-300 text-xl px-1" aria-label="back">←</button>
                )}
                <h1 className="text-xl font-bold text-white truncate">{titles[activeItem]}</h1>
              </div>
              <button type="button" onClick={() => go('Profile')} className="flex items-center gap-2 min-w-0">
                <span className="text-[11px] text-zinc-400 truncate hidden sm:block">@{profile.username}</span>
                <Avatar size="w-9 h-9" />
              </button>
            </header>

            {annBanner}

            {activeItem === 'Friends' && (
              <div className="space-y-4">
                <div className="grid grid-cols-3 gap-2 p-1 rounded-2xl bg-zinc-900/60 border border-zinc-800/80">
                  {[['streaks', '🔥 ' + t.friendsStreaks], ['groups', '👥 ' + t.railGroups], ['users', '👤 ' + t.friendsUsers]].map(([id, label]) => (
                    <button key={id} type="button" onClick={() => setFriendsTab(id)} className={`py-2 rounded-xl text-xs font-semibold ${friendsTab === id ? 'bg-white text-black' : 'text-zinc-400'}`}>{label}</button>
                  ))}
                </div>
                {friendsTab === 'streaks' && <StreaksView uid={userEmail} adminData={adminData} streaks={streaks} lang={lang} onSendTo={sendTo} />}
                {friendsTab === 'groups' && <GroupsView uid={userEmail} adminData={adminData} groups={groups} lang={lang} />}
                {friendsTab === 'users' && (
                  <UsersView userEmail={userEmail} profile={profile} isGoogle={!!userProfile} adminData={adminData} lang={lang} blocks={blocks} onBlock={onBlock} onUnblock={onUnblock} onReport={onReport} />
                )}
              </div>
            )}

            {(activeItem === 'Compose' || activeItem === 'Inbox') && (
              <MessagesView
                key={activeItem}
                mode={activeItem === 'Compose' ? 'compose' : 'inbox'}
                userEmail={userEmail} profile={profile} myAdmin={myAdmin} adminData={adminData}
                isAnonymous={isAnonymous} setIsAnonymous={setIsAnonymous} lang={lang}
                messaging={messaging} blocks={blocks} onBlock={onBlock} onUnblock={onUnblock} onReport={onReport}
                presetSticker={presetSticker} clearPreset={() => setPresetSticker('')}
                presetRecipient={presetRecipient} clearRecipient={() => setPresetRecipient('')}
              />
            )}

            {activeItem === 'Profile' && (
              <div className="space-y-5">
                <div className="p-5 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 flex items-center gap-4">
                  <Avatar size="w-16 h-16" />
                  <div className="min-w-0 flex-1">
                    <p className="text-lg font-bold text-white truncate"><UserName name={profile.name} info={myAdmin} t={t} /></p>
                    <p className="text-xs text-zinc-500">@{profile.username}</p>
                    <div className="mt-1.5"><RankBadge rank={myAdmin.rank} t={t} /></div>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <button type="button" onClick={() => go('Setting')} className="py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs font-semibold">⚙️ {t.railSettings}</button>
                  <button type="button" onClick={() => go('File Manager')} className="py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs font-semibold">😊 {t.railStickers}</button>
                  <button type="button" onClick={onLogout} className="py-3 rounded-xl bg-zinc-900 border border-rose-500/30 text-rose-400 text-xs font-semibold">{t.logout}</button>
                </div>
                <HomeView userEmail={userEmail} profile={profile} adminData={adminData} messaging={messaging} lang={lang} onGo={(id) => go(id === 'Messages' ? 'Inbox' : id)} />
              </div>
            )}

            {activeItem === 'File Manager' && (
              <StickersView lang={lang} onUseSticker={(s) => { setPresetSticker(s); setActiveItem('Compose'); }} />
            )}

            {activeItem === 'Setting' && (
              <SettingsView
                lang={lang}
                setLang={setLang}
                isAnonymous={isAnonymous}
                setIsAnonymous={setIsAnonymous}
                acceptAnon={acceptAnon}
                onToggleAcceptAnon={onToggleAcceptAnon}
                blocks={blocks}
                onUnblock={onUnblock}
                announcement={announcement}
                onSetAnnouncement={onSetAnnouncement}
                reports={reports}
                onResolveReport={onResolveReport}
                userEmail={userEmail}
                authEmail={authEmail}
                isOwner={isOwner}
                onRemoveUserAdmin={onRemoveUserAdmin}
                profile={profile}
                profileEdits={profileEdits}
                googlePicture={(userProfile && userProfile.picture) || ''}
                onSaveProfile={onSaveProfile}
                adminUnlocked={adminUnlocked}
                onAdminUnlock={() => setAdminUnlocked(true)}
                onAdminLock={() => setAdminUnlocked(false)}
                adminData={adminData}
                onUpdateUserAdmin={onUpdateUserAdmin}
                onResetAdminData={onResetAdminData}
              />
            )}
          </div>
          {bottomBar}
        </div>
      );
    }

    function App() {
      const [authState, setAuthState] = useState('loading'); // loading | out | in
      const [authUser, setAuthUser] = useState(null);
      const [registered, setRegistered] = useState({});
      const [isOwner, setIsOwner] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [blocks, setBlocks] = useState({});
      const [announcement, setAnnouncement] = useState(null);
      const [reports, setReports] = useState([]);
      const [lang, setLang] = useState('es'); // Default: Spanish
      const [isAnonymous, setIsAnonymous] = useState(true); // Default: Anonymous enabled
      const t = translations[lang];

      // Firebase session
      useEffect(() => {
        if (!fbReady) { setAuthState('out'); return; }
        return auth.onAuthStateChanged(async (u) => {
          if (!u) { setAuthUser(null); setIsOwner(false); setRegistered({}); setAuthState('out'); return; }
          try {
            const data = await ensureUserDoc(u);
            if (data.suspended) {
              setLoginError(t.accountSuspended);
              await auth.signOut();
              return;
            }
            setLoginError('');
            setAuthUser({ uid: u.uid, email: u.email || '', photo: u.photoURL || '', name: u.displayName || '' });
            setAuthState('in');
          } catch (e) {
            console.error('login', e);
            setLoginError(t.fbDbError + (e && e.code ? ' (' + e.code + ')' : ''));
            await auth.signOut();
          }
        });
      }, []);

      // Live users list + owner check
      const uid = authUser ? authUser.uid : null;
      useEffect(() => {
        if (!uid) return;
        let cancelled = false;
        const unsub = db.collection('users').onSnapshot((snap) => {
          const m = {};
          snap.forEach((d) => {
            const x = d.data();
            m[d.id] = {
              name: x.name || '', username: x.username || '', picture: x.picture || '',
              joined: tsToDate(x.joined), rank: x.rank || 'member', verified: !!x.verified,
              nameColor: x.nameColor || '', suspended: !!x.suspended, acceptAnon: x.acceptAnon !== false
            };
          });
          setRegistered(m);
        }, (e) => console.error('users', e));
        db.collection('adminCheck').doc('ping').get()
          .then(() => { if (!cancelled) setIsOwner(true); })
          .catch(() => { if (!cancelled) setIsOwner(false); });
        const unsubBlocks = db.collection('blocks').doc(uid).collection('list').onSnapshot((snap) => {
          const m = {};
          snap.forEach((d) => { m[d.id] = d.data(); });
          setBlocks(m);
        }, (e) => console.error('blocks', e));
        const unsubAnn = db.collection('meta').doc('announcement').onSnapshot((d) => {
          if (!d.exists) { setAnnouncement(null); return; }
          const x = d.data({ serverTimestamps: 'estimate' });
          setAnnouncement({ text: x.text || '', active: !!x.active, ts: tsMillis(x.ts) });
        }, (e) => console.error('announcement', e));
        return () => { cancelled = true; unsub(); unsubBlocks(); unsubAnn(); };
      }, [uid]);

      // Reports are only readable by the owner account
      useEffect(() => {
        if (!uid || !isOwner) { setReports([]); return; }
        return db.collection('reports').orderBy('ts', 'desc').limit(50).onSnapshot((snap) => {
          setReports(snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })));
        }, (e) => console.error('reports', e));
      }, [uid, isOwner]);

      // If an admin suspends you while you are inside, you are signed out
      useEffect(() => {
        if (uid && registered[uid] && registered[uid].suspended) {
          setLoginError(t.accountSuspended);
          auth.signOut();
        }
      }, [uid, registered]);

      const handleGoogleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await auth.signInWithPopup(provider);
        } catch (e) {
          if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
          if (e.code === 'auth/popup-blocked') { await auth.signInWithRedirect(provider); return; }
          throw e;
        }
      };

      const handleLogout = () => { if (auth) auth.signOut(); };

      // ----- Admin actions (Firestore rules only allow the owner account) -----
      const handleUpdateUserAdmin = async (targetUid, patch) => {
        const clean = cleanAdminPatch(patch);
        if (!Object.keys(clean).length) return;
        try { await db.collection('users').doc(targetUid).update(clean); }
        catch (e) { console.error('admin update', e); window.alert(t.saveFailed + (e.code ? ' (' + e.code + ')' : '')); }
      };
      const handleRemoveUserAdmin = async (targetUid) => {
        try {
          const batch = db.batch();
          batch.delete(db.collection('users').doc(targetUid));
          const un = registered[targetUid] && registered[targetUid].username;
          if (un) batch.delete(db.collection('usernames').doc(un));
          await batch.commit();
        } catch (e) { console.error('admin remove', e); window.alert(t.saveFailed + (e.code ? ' (' + e.code + ')' : '')); }
      };
      const handleResetAdminData = async () => {
        try {
          const ids = Object.keys(registered);
          for (let i = 0; i < ids.length; i += 400) {
            const batch = db.batch();
            ids.slice(i, i + 400).forEach((id) => batch.update(db.collection('users').doc(id), { rank: 'member', verified: false, nameColor: '', suspended: false }));
            await batch.commit();
          }
        } catch (e) { console.error('admin reset', e); window.alert(t.saveFailed + (e.code ? ' (' + e.code + ')' : '')); }
      };

      const handleBlock = async (target, name, username) => {
        try { await db.collection('blocks').doc(uid).collection('list').doc(target).set({ ts: serverTs(), name: name || '', username: username || '' }); }
        catch (e) { console.error('block', e); window.alert(t.saveFailed + (e.code ? ' (' + e.code + ')' : '')); }
      };
      const handleUnblock = async (target) => {
        try { await db.collection('blocks').doc(uid).collection('list').doc(target).delete(); }
        catch (e) { console.error('unblock', e); }
      };
      const handleReport = async (r) => {
        try {
          await db.collection('reports').add({ reporterUid: uid, kind: r.kind, targetUid: r.targetUid || '', text: r.text || '', tok: r.tok || '', ts: serverTs() });
          window.alert(t.reportSent);
        } catch (e) { console.error('report', e); window.alert(t.saveFailed + (e.code ? ' (' + e.code + ')' : '')); }
      };
      const handleResolveReport = async (id) => {
        try { await db.collection('reports').doc(id).delete(); } catch (e) { console.error('resolve', e); }
      };
      const handleSetAnnouncement = async (text) => {
        try {
          if (text) await db.collection('meta').doc('announcement').set({ text, active: true, ts: serverTs() });
          else await db.collection('meta').doc('announcement').set({ text: '', active: false, ts: serverTs() });
        } catch (e) { console.error('announce', e); window.alert(t.saveFailed + (e.code ? ' (' + e.code + ')' : '')); }
      };
      const handleToggleAcceptAnon = async (v) => {
        try { await db.collection('users').doc(uid).update({ acceptAnon: !!v }); }
        catch (e) { console.error('acceptAnon', e); window.alert(t.saveFailed + (e.code ? ' (' + e.code + ')' : '')); }
      };

      // ----- Profile -----
      const me = authUser ? registered[authUser.uid] : null;
      const profile = authUser ? {
        name: (me && me.name) || authUser.name || defaultUsername(authUser.email),
        picture: me ? me.picture : authUser.photo,
        username: (me && me.username) || defaultUsername(authUser.email)
      } : { name: '', picture: '', username: '' };
      const hasCustomPic = !!(me && me.picture && me.picture !== authUser.photo);
      const profileEdits = { picture: hasCustomPic ? me.picture : '' };

      const handleSaveProfile = async (edits) => {
        if (!me) return 'error';
        const newPic = edits.picture || authUser.photo || '';
        try {
          const batch = db.batch();
          if (me.username !== edits.username) {
            const s = await db.collection('usernames').doc(edits.username).get();
            if (s.exists && s.data().uid !== authUser.uid) return 'taken';
            batch.delete(db.collection('usernames').doc(me.username));
            batch.set(db.collection('usernames').doc(edits.username), { uid: authUser.uid });
          }
          batch.update(db.collection('users').doc(authUser.uid), { name: edits.displayName, username: edits.username, picture: newPic });
          await batch.commit();
          return true;
        } catch (e) {
          console.error('save profile', e);
          return 'error';
        }
      };

      if (authState === 'loading') {
        return <div className="min-h-screen bg-black flex items-center justify-center text-zinc-500 text-sm">{t.loadingApp}</div>;
      }

      return (
        <React.Fragment>
          {authState !== 'in' || !authUser ? (
            <LoginScreen onGoogleLogin={handleGoogleLogin} loginError={loginError} lang={lang} />
          ) : (
            <DashboardScreen
              blocks={blocks}
              onBlock={handleBlock}
              onUnblock={handleUnblock}
              onReport={handleReport}
              announcement={announcement}
              onSetAnnouncement={handleSetAnnouncement}
              reports={reports}
              onResolveReport={handleResolveReport}
              acceptAnon={!me || me.acceptAnon !== false}
              onToggleAcceptAnon={handleToggleAcceptAnon}
              userEmail={authUser.uid}
              authEmail={authUser.email}
              isOwner={isOwner}
              onLogout={handleLogout}
              profile={profile}
              profileEdits={profileEdits}
              onSaveProfile={handleSaveProfile}
              adminData={registered}
              onUpdateUserAdmin={handleUpdateUserAdmin}
              onRemoveUserAdmin={handleRemoveUserAdmin}
              onResetAdminData={handleResetAdminData}
              userProfile={{ name: authUser.name, picture: authUser.photo }}
              lang={lang}
              setLang={setLang}
              isAnonymous={isAnonymous}
              setIsAnonymous={setIsAnonymous}
            />
          )}
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
