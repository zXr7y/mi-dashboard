    const findRecipient = (users, raw) => {
      const q = (raw || '').trim().replace(/^@/, '').toLowerCase();
      if (!q) return { error: 'notfound' };
      const list = Object.keys(users).map((email) => ({
        email,
        username: String(users[email].username || defaultUsername(email)).toLowerCase(),
        name: String(users[email].name || '').toLowerCase()

    function MessagesView({ userEmail, profile, myAdmin, adminData, isAnonymous, lang }) {
      const t = translations[lang];
      const [allMessages, setAllMessages] = useState(() => loadMessages());
      const [registered, setRegistered] = useState(() => loadRegisteredUsers());
      const [recipient, setRecipient] = useState('');
      const [text, setText] = useState('');
      const [sendError, setSendError] = useState('');
      const [sendOk, setSendOk] = useState(false);

      // Pick up changes made from another tab of this same browser
      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === MESSAGES_KEY || e.key === USERS_KEY) {
            setAllMessages(loadMessages());
            setRegistered(loadRegisteredUsers());
          }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      const handleSendMessage = (e) => {
        e.preventDefault();
        setSendOk(false);
        const to = recipient.trim();
        const body = text.trim().slice(0, 1000);
        if (!to || !body) return;

        // The recipient must be a registered user, otherwise nothing is sent
        const users = loadRegisteredUsers();
        const found = findRecipient(users, to);
        if (found.error === 'ambiguous') { setSendError(t.msgUserAmbiguous); return; }
        if (found.error) { setSendError(t.msgUserNotFound); return; }

        const target = users[found.email];
        const msg = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
          fromEmail: userEmail,
          toEmail: found.email,
          text: body,
          ts: Date.now(),
          isAnon: isAnonymous,
          toName: target.name || '',
          toUsername: target.username || defaultUsername(found.email)
        };
        if (!isAnonymous) {
          msg.fromName = profile.name;
          msg.fromUsername = profile.username;
        }

        const next = [...loadMessages(), msg].slice(-500);
        if (!saveMessages(next)) { setSendError(t.msgSendFailed); return; }

        setAllMessages(next);
        setRegistered(users);
        setSendError('');
        setRecipient('');
        setText('');
        setSendOk(true);
        setTimeout(() => setSendOk(false), 3000);
      };

      // Messages I sent or received, newest first
      const visible = allMessages
        .filter((m) => m && (m.fromEmail === userEmail || m.toEmail === userEmail))
        .sort((a, b) => b.ts - a.ts);

      const describe = (email, snapName, snapUser) => {
        const r = registered[email];
        return {
          email,
          name: (r && r.name) || snapName || t.unknownUser,
          username: (r && (r.username || defaultUsername(email))) || snapUser || '',
          picture: (r && r.picture) || ''
        };
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <div className="flex items-center space-x-2">
                <h2 className="text-2xl font-bold text-white tracking-tight">{t.messageCenter}</h2>
                <span className={`text-[10px] uppercase font-bold tracking-wider px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm ${
                  isAnonymous
                    ? 'bg-amber-400 text-black shadow-amber-400/20'
                    : 'bg-zinc-800 text-zinc-300 border border-zinc-700'
                }`}>
                  <Icon name={isAnonymous ? "shield-off" : "user-check"} className="w-3 h-3" />
                  {isAnonymous ? t.anonBadge : t.publicBadge}
                </span>
              </div>
              <p className="text-xs text-zinc-400 mt-1">
                {isAnonymous ? t.anonActiveDesc : t.identActiveDesc}
              </p>
            </div>
            <span className="text-xs px-3 py-1 rounded-full bg-amber-400/10 text-amber-400 border border-amber-400/20 font-medium">
              {visible.length} {t.messages}
            </span>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Form Column */}
            <div className="lg:col-span-1 p-6 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 h-fit">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-lg font-semibold text-white flex items-center space-x-2">
                  <Icon name="send" className="w-4 h-4 text-amber-400" />
                  <span>{isAnonymous ? t.sendAnon : t.sendMessage}</span>
                </h3>
              </div>

              {/* Status Notice */}
              <div className={`mb-4 p-3 rounded-xl border flex items-start space-x-2.5 ${
                isAnonymous
                  ? 'bg-amber-400/10 border-amber-400/20 text-amber-200/90'
                  : 'bg-zinc-950/80 border-zinc-800 text-zinc-400'
              }`}>
                <Icon name={isAnonymous ? "eye-off" : "user"} className="w-4 h-4 text-amber-400 flex-shrink-0 mt-0.5" />
                <p className="text-xs leading-relaxed">
                  {isAnonymous ? t.privacyNoticeAnon : t.privacyNoticeIdent}
                </p>
              </div>

              <form onSubmit={handleSendMessage} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">
                    {t.recipientLabel}
                  </label>
                  <input
                    type="text"
                    required
                    value={recipient}
                    onChange={(e) => { setRecipient(e.target.value); setSendError(''); }}
                    placeholder={t.recipientPlaceholder}
                    autoCapitalize="none"
                    autoCorrect="off"
                    spellCheck="false"
                    className="w-full px-3.5 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all"
                  />
                  <p className="text-[11px] text-zinc-500 mt-1.5">{t.recipientHint}</p>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5">
                    {t.messageLabel}
                  </label>
                  <textarea
                    required
                    rows="4"
                    maxLength={1000}
                    value={text}
                    onChange={(e) => setText(e.target.value)}
                    placeholder={t.messagePlaceholder}
                    className="w-full px-3.5 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all resize-none"
                  ></textarea>
                </div>

                {sendError && <p className="text-xs text-rose-400">{sendError}</p>}
                {sendOk && <p className="text-xs text-emerald-400">✓ {t.msgSent}</p>}

                <button
                  type="submit"
                  className="w-full py-3 px-4 bg-amber-400 hover:bg-amber-300 text-black font-semibold rounded-xl text-sm flex items-center justify-center space-x-2 shadow-lg shadow-amber-400/20 transition-all active:scale-[0.99]"
                >
                  <Icon name="send" className="w-4 h-4" />
                  <span>{isAnonymous ? t.sendAnon : t.sendMessage}</span>
                </button>
              </form>
            </div>

            {/* Messages Feed */}
            <div className="lg:col-span-2 p-6 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 flex flex-col">
              <h3 className="text-lg font-semibold text-white mb-4 flex items-center space-x-2">
                <Icon name="message-square" className="w-4 h-4 text-amber-400" />
                <span>{t.messageHistory}</span>
              </h3>

              <div className="space-y-3 overflow-y-auto max-h-[420px] pr-1">
                {visible.length === 0 ? (
                  <div className="text-center py-12 text-zinc-500 text-sm">
                    {t.noMessages}
                  </div>
                ) : (
                  visible.map((msg) => {
                    const sent = msg.fromEmail === userEmail;
                    // Anonymous messages hide the sender from whoever receives them
                    const party = sent
                      ? describe(msg.toEmail, msg.toName, msg.toUsername)
                      : (msg.isAnon ? null : describe(msg.fromEmail, msg.fromName, msg.fromUsername));
                    const info = party ? getAdminInfo(adminData, party.email) : null;
                    return (
                      <div
                        key={msg.id}
                        className="p-4 rounded-xl bg-zinc-950/60 border border-zinc-800/60 hover:border-zinc-700 transition-all space-y-2"
                      >
                        <div className="flex items-center justify-between flex-wrap gap-2">
                          <div className="flex items-center space-x-2.5 min-w-0">
                            {party && party.picture ? (
                              <img
                                src={party.picture}
                                alt=""
                                referrerPolicy="no-referrer"
                                className="w-8 h-8 rounded-lg border border-zinc-700 object-cover flex-shrink-0"
                              />
                            ) : (
                              <div className="w-8 h-8 rounded-lg border bg-zinc-800 border-zinc-700 flex items-center justify-center font-bold text-sm flex-shrink-0 text-amber-400">
                                {party ? party.name.charAt(0).toUpperCase() : '?'}
                              </div>
                            )}
                            <div className="min-w-0">
                              <div className="flex items-center flex-wrap gap-x-2 text-xs">
                                <span className="text-zinc-500">{sent ? t.toUser : t.fromUser}</span>
                                {party ? (
                                  <>
                                    <span className="font-semibold text-white">
                                      <UserName name={party.name} info={info} t={t} />
                                    </span>
                                    <span className="text-zinc-500 text-[11px]">@{party.username}</span>
                                  </>
                                ) : (
                                  <span className="font-semibold text-zinc-300">{t.anonymousSender}</span>
                                )}
                                {sent && !msg.isAnon && (
                                  <span className="text-zinc-400 text-[11px]">
                                    ({t.fromUser}{' '}
                                    <span style={{ color: safeColor(myAdmin.nameColor) }}>@{profile.username}</span>
                                    {myAdmin.verified && <VerifiedBadge title={t.verified} />})
                                  </span>
                                )}
                              </div>
                              <span className="text-[10px] text-zinc-500">{formatMsgTime(msg.ts, lang)}</span>
                            </div>
                          </div>
                          <span className={`text-[10px] px-2.5 py-1 rounded-full border font-medium ${
                            !sent
                              ? 'bg-emerald-400/10 text-emerald-300 border-emerald-400/30'
                              : msg.isAnon
                                ? 'bg-amber-400/10 text-amber-400 border-amber-400/20'
                                : 'bg-zinc-800/80 text-zinc-300 border-zinc-700'
                          }`}>
                            {!sent ? t.receivedStatus : (msg.isAnon ? t.sentAnonStatus : t.sentIdentStatus)}
                          </span>
                        </div>
                        <p className="text-sm text-zinc-300 pl-10 pt-1 leading-relaxed break-words whitespace-pre-wrap">
                          {msg.text}
                        </p>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AdminPanel({ lang, currentEmail, adminData, onUpdateUser, onResetAll, onLock }) {
      const t = translations[lang];
      const [registered, setRegistered] = useState(() => loadRegisteredUsers());
      const [query, setQuery] = useState('');

      const entries = Object.keys(registered).map((email) => ({
        email,
        name: registered[email].name || email.split('@')[0],
        username: registered[email].username || defaultUsername(email),
        picture: registered[email].picture || '',
        info: getAdminInfo(adminData, email)
      }));

      const q = query.trim().toLowerCase();
      const filtered = entries.filter((u) => u.name.toLowerCase().includes(q) || u.username.includes(q));

      const stats = [
        { label: t.adminStatUsers, value: entries.length },
        { label: t.adminStatVerified, value: entries.filter((u) => u.info.verified).length },
        { label: t.adminStatAdmins, value: entries.filter((u) => u.info.rank === 'admin').length },
        { label: t.adminStatSuspended, value: entries.filter((u) => u.info.suspended).length }
      ];

      const handleRemove = (email) => {
        if (!window.confirm(t.adminConfirmRemove)) return;
        const next = { ...registered };
        delete next[email];
        saveRegisteredUsers(next);
        setRegistered(next);
      };

      const handleReset = () => {
        if (window.confirm(t.adminConfirmReset)) onResetAll();
      };

      return (
        <div className="p-6 rounded-2xl bg-zinc-900/60 border border-amber-400/30 space-y-5">
          <div className="flex items-start justify-between gap-3 flex-wrap">
            <div className="space-y-1">
              <div className="flex items-center flex-wrap gap-2">
                <Icon name="shield-check" className="w-5 h-5 text-amber-400" />
                <h3 className="text-base font-semibold text-white">{t.adminPanel}</h3>
                <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-amber-400 text-black">
                  {t.adminModeBadge}
                </span>
              </div>
              <p className="text-xs text-zinc-400">{t.adminUnlockedDesc}</p>
            </div>
            <button
              type="button"
              onClick={onLock}
              className="py-2 px-4 bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-zinc-300 rounded-xl text-xs font-medium flex items-center space-x-2 transition-all"
            >
              <Icon name="lock" className="w-3.5 h-3.5" />
              <span>{t.adminLock}</span>
            </button>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            {stats.map((s) => (
              <div key={s.label} className="p-4 rounded-xl bg-zinc-950/60 border border-zinc-800/60">
                <p className="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold">{s.label}</p>
                <p className="text-2xl font-bold text-white mt-1">{s.value}</p>
              </div>
            ))}
          </div>

          <input
            type="text"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder={t.adminSearch}
            className="w-full px-3.5 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all"
          />

          <div className="space-y-3">
            {filtered.length === 0 ? (
              <div className="text-center py-8 text-zinc-500 text-sm">{t.adminNoUsers}</div>
            ) : (
              filtered.map((u) => {
                const isSelf = u.email === currentEmail;
                return (
                  <div key={u.email} className="p-4 rounded-xl bg-zinc-950/60 border border-zinc-800/60 space-y-4">
                    <div className="flex items-center space-x-3 min-w-0">
                      {u.picture ? (
                        <img
                          src={u.picture}
                          alt=""
                          referrerPolicy="no-referrer"
                          className="w-10 h-10 rounded-full border border-zinc-700 object-cover flex-shrink-0"
                        />
                      ) : (
                        <div className="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-amber-400 font-bold flex-shrink-0">
                          {u.name.charAt(0).toUpperCase()}
                        </div>
                      )}
                      <div className="min-w-0">
                        <p className="text-sm font-semibold text-white truncate">
                          <UserName name={u.name} info={u.info} t={t} />
                          {isSelf && (
                            <span className="ml-2 text-[10px] px-2 py-0.5 rounded-full bg-amber-400 text-black font-bold align-middle">
                              {t.youBadge}
                            </span>
                          )}
                        </p>
                        <p className="text-xs text-zinc-500 truncate">@{u.username}</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-[10px] font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">
                          {t.adminRank}
                        </label>
                        <select
                          value={hasRank(u.info.rank) ? u.info.rank : 'member'}
                          onChange={(e) => onUpdateUser(u.email, { rank: e.target.value })}
                          className="w-full px-3 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-white text-sm focus:outline-none focus:border-amber-400"
                        >
                          {Object.keys(RANKS).map((r) => (
                            <option key={r} value={r}>{t[RANKS[r].labelKey]}</option>
                          ))}
                        </select>
                      </div>

                      <div className="space-y-3">
                        <div className="flex items-center justify-between gap-3">
                          <span className="text-xs text-zinc-300">{t.adminVerified}</span>
                          <SwitchBtn
                            checked={!!u.info.verified}
                            onChange={(v) => onUpdateUser(u.email, { verified: v })}
                            onClass="bg-sky-400"
                          />
                        </div>
                        <div className="flex items-center justify-between gap-3">
                          <span className="text-xs text-zinc-300">{t.adminSuspend}</span>
                          <SwitchBtn

    function SettingsView({ lang, setLang, isAnonymous, setIsAnonymous, userEmail, profile, profileEdits, googlePicture, onSaveProfile, adminUnlocked, onAdminUnlock, onAdminLock, adminData, onUpdateUserAdmin, onResetAdminData }) {
      const t = translations[lang];
      const [savedAlert, setSavedAlert] = useState(false);

      // Profile editing
      const [displayName, setDisplayName] = useState(profile.name);
      const [username, setUsername] = useState(profile.username);
      const [pendingPicture, setPendingPicture] = useState(undefined); // undefined = unchanged, '' = removed
      const [profileError, setProfileError] = useState('');
      const [profileSavedAlert, setProfileSavedAlert] = useState(false);

      // Admin gate
      const [adminPass, setAdminPass] = useState('');
      const [adminError, setAdminError] = useState('');
      const handleAdminUnlock = (e) => {
        e.preventDefault();
        if (adminPass === ADMIN_PASSWORD) {
          setAdminPass('');
          setAdminError('');
          onAdminUnlock();
        } else {
          setAdminError(t.adminWrongPassword);
        }
      };

      const hasCustomPhoto = pendingPicture !== undefined ? !!pendingPicture : !!profileEdits.picture;
      const previewPicture = pendingPicture !== undefined ? (pendingPicture || googlePicture) : profile.picture;

      // Resize + center-crop the chosen photo to a 256x256 JPEG so it fits in browser storage
      const handlePhotoChange = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!file.type || file.type.indexOf('image/') !== 0) { setProfileError(t.photoInvalid); return; }
        if (file.size > 15 * 1024 * 1024) { setProfileError(t.photoTooBig); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const side = Math.min(img.width, img.height);
            const sx = (img.width - side) / 2;
            const sy = (img.height - side) / 2;
            canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
            setPendingPicture(canvas.toDataURL('image/jpeg', 0.85));
            setProfileError('');
          };
          img.onerror = () => setProfileError(t.photoInvalid);
          img.src = reader.result;
        };
        reader.onerror = () => setProfileError(t.photoInvalid);
        reader.readAsDataURL(file);
      };

      const handleProfileSave = () => {
        const name = displayName.trim();
        const user = username.trim();
        if (!name) { setProfileError(t.errNameEmpty); return; }
        if (!/^[a-z0-9_.]{3,20}$/.test(user)) { setProfileError(t.errUsername); return; }
        const others = loadRegisteredUsers();
        const taken = Object.keys(others).some(
          (em) => em !== userEmail && String(others[em].username || defaultUsername(em)).toLowerCase() === user
        );
        if (taken) { setProfileError(t.errUsernameTaken); return; }
        const edits = {
          displayName: name,
          username: user,
          picture: pendingPicture !== undefined ? pendingPicture : (profileEdits.picture || '')
        };
        if (!onSaveProfile(edits)) { setProfileError(t.saveFailed); return; }
        setProfileError('');
        setPendingPicture(undefined);
        setProfileSavedAlert(true);
        setTimeout(() => setProfileSavedAlert(false), 3000);
      };

      const handleSave = () => {
        setSavedAlert(true);
        setTimeout(() => setSavedAlert(false), 3000);
      };

      return (

    function UsersView({ userEmail, profile, isGoogle, adminData, lang }) {
      const t = translations[lang];
      const [query, setQuery] = useState('');

      // Real users: everyone who signed in with Google on this device.
      // (No backend yet, so this list is saved in this browser only.)
      const [users] = useState(() => {
        const STORAGE_KEY = 'dashboardRegisteredUsers';
        const today = new Date().toISOString().slice(0, 10);
        let stored = {};
        try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { stored = {}; }

        if (isGoogle) {
          // Only verified Google sign-ins are saved
          const prev = stored[userEmail];
          stored[userEmail] = {
            name: profile.name || userEmail,
            picture: profile.picture || '',
            username: profile.username || '',
            joined: (prev && prev.joined) || today
          };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stored)); } catch (e) {}
        }

        const list = Object.keys(stored).map((email, i) => ({
          id: i + 1,
          email,
          name: stored[email].name,
          picture: stored[email].picture,
          username: stored[email].username || defaultUsername(email),
          joined: stored[email].joined,
          isYou: email === userEmail,
          online: email === userEmail
        }));

        if (!isGoogle) {
          list.unshift({
            id: 0, email: userEmail, name: profile.name,
            picture: profile.picture, username: profile.username,
            joined: today, isYou: true, online: true
          });
        }
        return list;
      });

      const q = query.trim().toLowerCase();
      const filtered = users.filter(
        (u) => u.name.toLowerCase().includes(q) || (u.username || '').includes(q)
      );

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>

                <Icon name="search" className="w-4 h-4" />

              <input

                onChange={(e) => setQuery(e.target.value)}
                placeholder={t.searchUsers}
                className="w-full pl-10 pr-4 py-2.5 bg-zinc-950/60 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 text-sm focus:outline-none focus:border-amber-400 transition-all"

              ) : (

                  <div

            </div>
          </div>

          <div className="p-6 rounded-2xl bg-zinc-900/60 border border-zinc-800/80">
            <h3 className="text-lg font-semibold text-white mb-4">{t.recentActivity} {title}</h3>
            <div className="space-y-3">
              {[1, 2, 3].map((i) => (
                <div key={i} className="flex items-center justify-between p-3 rounded-xl bg-zinc-950/40 border border-zinc-800/50">
                  <div className="flex items-center space-x-3">
                    <div className="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-300">
                      #{i}
                    </div>
                    <div>
                      <p className="text-sm font-medium text-zinc-200">Activity #{i} ({title})</p>
                      <p className="text-xs text-zinc-500">Updated recently</p>
                    </div>
                  </div>
                  <span className="text-xs text-zinc-400">{t.completed}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function DashboardScreen({ userEmail, userProfile, profile, profileEdits, onSaveProfile, adminData, onUpdateUserAdmin, onResetAdminData, onLogout, lang, setLang, isAnonymous, setIsAnonymous }) {
      const t = translations[lang];
      const [activeItem, setActiveItem] = useState('Dashboard');
      const [isOpen, setIsOpen] = useState(true);
      const [adminUnlocked, setAdminUnlocked] = useState(false); // locks again on logout or reload
      const myAdmin = getAdminInfo(adminData, userEmail);

      // Dynamic Menu Names
      const menuItems = [
        { id: 'Dashboard', name: t.dashboard, icon: 'layout-dashboard' },
        { id: 'User', name: t.user, icon: 'user' },
        { id: 'Messages', name: t.messages, icon: 'message-square' },
        { id: 'File Manager', name: t.fileManager, icon: 'folder-kanban' },
        { id: 'Setting', name: t.setting, icon: 'settings' },
      ];

      return (
        <div className="min-h-screen bg-black flex p-3 sm:p-6 gap-6">
          
          {/* Responsive Sidebar */}
          <aside className={`transition-all duration-300 ease-in-out bg-zinc-950 text-white rounded-3xl p-4 flex flex-col justify-between border border-zinc-800/80 shadow-2xl ${isOpen ? 'w-64' : 'w-20'}`}>
            <div>
              {/* Menu Header */}
              <div className="flex items-center justify-between mb-8 px-2 pt-2">
                <div className="flex items-center space-x-3">
                  <div className="w-9 h-9 rounded-2xl bg-amber-400 text-black flex items-center justify-center font-bold text-lg shadow-md shadow-amber-400/20">
                    ❖
                  </div>
                  {isOpen && <span className="font-bold text-lg tracking-wide text-white">{t.menu}</span>}
                </div>
                <button 
                  onClick={() => setIsOpen(!isOpen)} 
                  className="text-zinc-400 hover:text-white transition-colors p-1.5 rounded-lg hover:bg-zinc-900"
                >
                  <Icon name="menu" className="w-5 h-5" />
                </button>
              </div>

              {/* Navigation Items */}
              <nav className="space-y-2">
                {menuItems.map((item) => {
                  const isActive = activeItem === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveItem(item.id)}
                      className={`w-full flex items-center space-x-3 px-4 py-3.5 rounded-2xl transition-all duration-200 ${
                        isActive 
                          ? 'bg-white text-zinc-950 font-semibold shadow-lg shadow-white/10' 
                          : 'text-zinc-400 hover:text-white hover:bg-zinc-900/60'
                      }`}
                    >
                      <Icon name={item.icon} className={`w-5 h-5 flex-shrink-0 ${isActive ? 'text-zinc-950' : 'text-zinc-400'}`} />
                      {isOpen && <span className="text-sm whitespace-nowrap">{item.name}</span>}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Logout Action */}
            <div className="pt-4 border-t border-zinc-900">
              <button
                onClick={onLogout}
                className="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-rose-400 hover:bg-rose-500/10 transition-colors"
              >
                <Icon name="log-out" className="w-5 h-5 flex-shrink-0" />
                {isOpen && <span className="text-sm font-medium">{t.logout}</span>}
              </button>
            </div>
          </aside>

          {/* Main Workspace */}
          <main className="flex-1 rounded-3xl bg-zinc-950/40 border border-zinc-900/80 p-6 sm:p-8 overflow-y-auto">
            {/* Top Bar */}
            <header className="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-6 border-b border-zinc-900 gap-4">
              <div>
                <p className="text-xs font-semibold text-amber-400 tracking-wider uppercase">{t.workspace}</p>
                <h1 className="text-xl font-bold text-white">
                  {menuItems.find(m => m.id === activeItem)?.name || activeItem}
                </h1>
              </div>

              <div className="flex items-center space-x-3">
                <div className="text-right hidden sm:block">
                  <p className="text-xs font-medium text-zinc-200">
                    <UserName name={profile.name} info={myAdmin} t={t} />
                  </p>
                  <p className="text-[10px] text-emerald-400 font-mono">@{profile.username} · ● {t.connected}</p>
                </div>
                {profile.picture ? (
                  <img
                    src={profile.picture}
                    alt=""
                    referrerPolicy="no-referrer"
                    className="w-10 h-10 rounded-full border border-zinc-700 object-cover"
                  />
                ) : (
                  <div className="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-amber-400 font-bold">
                    {profile.name.charAt(0).toUpperCase()}
                  </div>
                )}
              </div>
            </header>

            {/* Dynamic Active Section View */}
            {activeItem === 'Messages' && (
              <MessagesView userEmail={userEmail} profile={profile} myAdmin={myAdmin} adminData={adminData} isAnonymous={isAnonymous} lang={lang} />
            )}
            {activeItem === 'Setting' && (
              <SettingsView
                lang={lang}
                setLang={setLang}
                isAnonymous={isAnonymous}
                setIsAnonymous={setIsAnonymous}
                userEmail={userEmail}
                profile={profile}
                profileEdits={profileEdits}
                googlePicture={(userProfile && userProfile.picture) || ''}
                onSaveProfile={onSaveProfile}
                adminUnlocked={adminUnlocked}
                onAdminUnlock={() => setAdminUnlocked(true)}
                onAdminLock={() => setAdminUnlocked(false)}
                adminData={adminData}
                onUpdateUserAdmin={onUpdateUserAdmin}
                onResetAdminData={onResetAdminData}
              />
            )}
            {activeItem === 'User' && (
              <UsersView userEmail={userEmail} profile={profile} isGoogle={!!userProfile} adminData={adminData} lang={lang} />
            )}
            {activeItem !== 'Messages' && activeItem !== 'Setting' && activeItem !== 'User' && (
              <SectionView title={menuItems.find(m => m.id === activeItem)?.name || activeItem} lang={lang} />
            )}
          </main>

        </div>
      );
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [userEmail, setUserEmail] = useState('');
      const [lang, setLang] = useState('es'); // Default: Spanish
      const [isAnonymous, setIsAnonymous] = useState(true); // Default: Anonymous enabled
      const [userProfile, setUserProfile] = useState(null);
      const [profileEdits, setProfileEdits] = useState({});

      const [adminData, setAdminData] = useState(() => loadAdminData());

      // Returns false when the account is suspended, so the login screen can say so
      const handleLoginSuccess = (email, googleProfile) => {
        if (getAdminInfo(adminData, email).suspended) return false;
        if (googleProfile) upsertRegisteredUser(email, googleProfile);
        setUserEmail(email);
        setUserProfile(googleProfile || null);
        setProfileEdits(loadProfileEdits(email));
        setIsAuthenticated(true);
        return true;
      };

      const handleUpdateUserAdmin = (email, patch) => {
        const next = applyAdminPatch(adminData, email, patch);
        setAdminData(next);
        saveAdminData(next);
      };

      const handleResetAdminData = () => {
        setAdminData({});
        saveAdminData({});
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setUserEmail('');
        setUserProfile(null);
        setProfileEdits({});
      };

      // What the app shows: your edits first, then your Google data, then defaults
      const profile = {
        name: profileEdits.displayName || (userProfile && userProfile.name) || userEmail.split('@')[0],
        picture: profileEdits.picture || (userProfile && userProfile.picture) || '',
        username: profileEdits.username || defaultUsername(userEmail)
      };

      const handleSaveProfile = (edits) => {
        const ok = storeProfileEdits(userEmail, edits);
        if (ok) {
          setProfileEdits(edits);
          if (userProfile) upsertRegisteredUser(userEmail, userProfile);
        }
        return ok;
      };

      return (
        <React.Fragment>
          {!isAuthenticated ? (
            <LoginScreen onLoginSuccess={handleLoginSuccess} lang={lang} />
          ) : (
            <DashboardScreen 
              userEmail={userEmail} 
              onLogout={handleLogout}
              profile={profile}
              profileEdits={profileEdits}
              onSaveProfile={handleSaveProfile}
              adminData={adminData}
              onUpdateUserAdmin={handleUpdateUserAdmin}
              onResetAdminData={handleResetAdminData}
              userProfile={userProfile} 
              lang={lang}
              setLang={setLang}
              isAnonymous={isAnonymous}
              setIsAnonymous={setIsAnonymous}
            />
          )}
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
