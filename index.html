    // Profile edits (photo, display name, username), saved per email in this browser.
    const PROFILES_KEY = 'dashboardProfileEdits';
    const loadProfileEdits = (email) => {
      try {
        const all = JSON.parse(localStorage.getItem(PROFILES_KEY) || '{}');
        return all[email] || {};
      } catch (e) { return {}; }
    };
    const storeProfileEdits = (email, edits) => {
      try {
        const all = JSON.parse(localStorage.getItem(PROFILES_KEY) || '{}');
        all[email] = edits;
        localStorage.setItem(PROFILES_KEY, JSON.stringify(all));
        return true;
      } catch (e) { return false; }
    };
    const sanitizeUsername = (v) => v.toLowerCase().replace(/[^a-z0-9_.]/g, '').slice(0, 20);
    const defaultUsername = (email) => sanitizeUsername((email || '').split('@')[0]) || 'user';

    // ---------- Admin panel ----------

      member:    { labelKey: 'rankMember',    cls: 'bg-zinc-800/80 text-zinc-300 border-zinc-700' },
      vip:       { labelKey: 'rankVip',       cls: 'bg-violet-400/10 text-violet-300 border-violet-400/30' },
      moderator: { labelKey: 'rankModerator', cls: 'bg-sky-400/10 text-sky-300 border-sky-400/30' },
      admin:     { labelKey: 'rankAdmin',     cls: 'bg-amber-400/10 text-amber-400 border-amber-400/20' }
    };
    const COLOR_PRESETS = ['#fbbf24', '#f87171', '#fb923c', '#34d399', '#38bdf8', '#a78bfa', '#f472b6', '#ffffff'];
    const DEFAULT_ADMIN_INFO = { rank: 'member', verified: false, nameColor: '', suspended: false };
    const ADMIN_DATA_KEY = 'dashboardAdminData';
    const USERS_KEY = 'dashboardRegisteredUsers';
    const MESSAGES_KEY = 'dashboardMessageHistory';

    const hasRank = (r) => Object.prototype.hasOwnProperty.call(RANKS, r);
    const safeColor = (c) => (/^#[0-9a-fA-F]{6}$/.test(c || '') ? c : undefined);
    const getAdminInfo = (data, email) => ({ ...DEFAULT_ADMIN_INFO, ...((data && data[email]) || {}) });

    const loadAdminData = () => { try { return JSON.parse(localStorage.getItem(ADMIN_DATA_KEY) || '{}') || {}; } catch (e) { return {}; } };
    const saveAdminData = (data) => { try { localStorage.setItem(ADMIN_DATA_KEY, JSON.stringify(data)); return true; } catch (e) { return false; } };
    const loadRegisteredUsers = () => { try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}') || {}; } catch (e) { return {}; } };
    const saveRegisteredUsers = (data) => { try { localStorage.setItem(USERS_KEY, JSON.stringify(data)); return true; } catch (e) { return false; } };

    // Persistent real message history
    const loadMessages = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(MESSAGES_KEY));
        if (Array.isArray(saved)) return saved;
      } catch (e) {}
      return [
        { id: 1, recipient: 'Ana García', text: '¡Hola! ¿Cómo va el avance del proyecto?', timestamp: '10 min ago', isAnon: true },
        { id: 2, recipient: 'Carlos Mendoza', text: 'Aquí tienes los reportes semanales actualizados.', timestamp: '45 min ago', isAnon: false }
      ];
    };
    const saveMessages = (msgs) => {
      try { localStorage.setItem(MESSAGES_KEY, JSON.stringify(msgs)); return true; } catch (e) { return false; }
    };

    const applyAdminPatch = (data, email, patch) => {
      const clean = {};
      if ('rank' in patch && hasRank(patch.rank)) clean.rank = patch.rank;
      if ('verified' in patch) clean.verified = !!patch.verified;
      if ('suspended' in patch) clean.suspended = !!patch.suspended;
      if ('nameColor' in patch) clean.nameColor = safeColor(patch.nameColor) || '';
      return { ...data, [email]: { ...DEFAULT_ADMIN_INFO, ...(data[email] || {}), ...clean } };
    };

    const upsertRegisteredUser = (email, googleProfile) => {
      const edits = loadProfileEdits(email);
      const all = loadRegisteredUsers();
      const prev = all[email];
      all[email] = {
        name: edits.displayName || (googleProfile && googleProfile.name) || email.split('@')[0],
        picture: edits.picture || (googleProfile && googleProfile.picture) || '',
        username: edits.username || defaultUsername(email),
        joined: (prev && prev.joined) || new Date().toISOString().slice(0, 10)
      };
      saveRegisteredUsers(all);
    };
